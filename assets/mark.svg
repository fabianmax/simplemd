<!-- simplemd mark: a Markdown heading with the caret parked after it.
     Ink #1d1d1f, accent #0969da (the app's own). Transparent ground —
     for the README, a site header, the about window. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <g transform="translate(-2.5 -5)">
    <g fill="#1d1d1f">
      <!-- bars run past both stems, as they do in a drawn # -->
      <rect x="20" y="42" width="48" height="8.5" rx="4.25"/>
      <rect x="20" y="60" width="48" height="8.5" rx="4.25"/>
      <g transform="translate(8 0) skewX(-10)">
        <rect x="34" y="24" width="8.5" height="62" rx="4.25"/>
        <rect x="52" y="24" width="8.5" height="62" rx="4.25"/>
      </g>
    </g>
    <rect x="76" y="24" width="9" height="62" rx="4.5" fill="#0969da"/>
  </g>
</svg>
